name: Tests
on:
    pull_request:
    push:
        branches:
            - 3.x
env:
  GITHUB_OAUTH: ${{ github.token }}
  COMPOSER_HOME: /tmp
jobs:
    build:
        runs-on: ubuntu-latest
        # Run in the production image, so tests use the same PHP and webhook versions.
        container:
            image: ghcr.io/city-of-helsinki/drupal-repository:latest
        steps:
            - name: Install test dependencies
              run: >-
                  apk add --no-cache bash curl gnupg jq
                  php85-dom php85-tokenizer php85-xml php85-xmlwriter php85-pecl-pcov

            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # The checkout is owned by the runner user, but the container runs as root.
            - name: Mark the workspace as safe for git
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Validate satis.json
              run: cat satis.json | jq type

            - name: Validate composer.json
              run: composer validate

            - name: Install Composer dependencies
              run: composer install --no-progress

            - name: Run installer
              run: make

            - name: Run phpcs
              run: vendor/bin/phpcs src tests --standard=PSR2

            - name: Run phpstan
              run: vendor/bin/phpstan analyze --no-progress

            - name: Run PHPUnit tests
              run: |
                  set -o pipefail && vendor/bin/phpunit --coverage-clover=coverage.xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                slug: City-of-Helsinki/drupal-repository
